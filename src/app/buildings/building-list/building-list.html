<div class="building-list-container">
  <div class="header">
    <h2>Buildings</h2>
    <button mat-raised-button color="primary" (click)="onAdd()">
      <mat-icon>add</mat-icon> Add Building
    </button>
  </div>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search buildings</mat-label>
    <input matInput [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  @if (loading()) {
    <div class="spinner">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else {
    <table mat-table [dataSource]="filteredBuildings()" [trackBy]="trackById">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let building">{{ building.name }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let building">{{ building.description }}</td>
      </ng-container>

      <ng-container matColumnDef="area">
        <th mat-header-cell *matHeaderCellDef>Area</th>
        <td mat-cell *matCellDef="let building">{{ building.polygon | area }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let building">
          <button mat-icon-button color="primary" (click)="onEdit(building.id)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onDelete(building.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (appDblClickEdit)="onEdit(row.id)"></tr>
    </table>
  }
</div>
